{% extends 'base.html' %}
{% block content %}
<style>
    .success-card {
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        text-align: center;
        max-width: 500px;
        margin: 50px auto;
        box-sizing: border-box;
    }
    .success-icon {
        font-size: 3.5rem;
        color: #2ecc71;
        margin-bottom: 15px;
    }
    h1 {
        color: #2c3e50;
        margin-top: 0;
    }
    p {
        color: #7f8c8d;
        font-size: 1.05rem;
        line-height: 1.5;
    }
    .btn-home {
        display: inline-block;
        margin-top: 20px;
        background: #3498db;
        color: white;
        padding: 10px 20px;
        text-decoration: none;
        border-radius: 4px;
        font-weight: bold;
    }
    .btn-home:hover {
        background: #2980b9;
    }
</style>

<div class="success-card">
    <div class="success-icon">✓</div>
    <h1>Submitted.</h1>
    <p>Thank you! Your response have been saved.</p>

    <a href="{% url 'fhome' %}" class="btn-home">Return to Form Home</a><p> (or use the top bar to access a different resource)</p>
</div>
{% endblock %}
