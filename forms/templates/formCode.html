{% extends 'base.html' %}
{% block content %}
<style>
    .container-forms { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; max-width: 400px; margin: 50px auto; box-sizing: border-box; }
    input[type="text"] { padding: 12px; width: 65%; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; margin-right: 5px; box-sizing: border-box; text-transform: uppercase; }
    .btn-submit { padding: 12px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
    .btn-submit:hover { background-color: #0056b3; }
</style>

<div class="container-forms">
    <h1>EliteDevelop Forms</h1><hr><br>
    <h2>Enter Your Form Code</h2>
    <form id="codeForm" onsubmit="redirectToUrl(event)">
        <input type="text" id="codeInput" placeholder="e.g., ExampleCODE123+" maxlength="20" required autocomplete="off">
        <button type="submit" class="btn-submit">Go</button>
    </form>

    {% if user.is_authenticated %}
        <a href="{% url 'fdashboard' %}" style="display:block; margin-top:20px; color:#3498db; font-weight:bold;">→ Forms Dashboard</a>
    {% else %}
        <p style="font-size:0.85rem; color:#7f8c8d; margin-top:20px;">Log in to create and manage custom forms.</p>
    {% endif %}
</div>

<script>
function redirectToUrl(event) {
    event.preventDefault();
    const userCode = document.getElementById('codeInput').value.trim();
    if (userCode) {
        window.location.href = "/forms/" + encodeURIComponent(userCode);
    }
}
</script>
{% endblock %}
