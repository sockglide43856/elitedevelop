{% extends "gaming/base.html" %}
{% block content %}
<div class="text-center">
    <h1 class="text-4xl text-cyan-400 font-bold neon-glow mb-8">Virtual Arcade</h1>
    <p>Enter your bet, then flip the coin to test your luck!</p>
    <div class="p-6 bg-slate-800 rounded-xl border border-cyan-500 inline-block">
        <p class="text-2xl mb-4">Balance: <span class="text-cyan-400 font-bold">⚡ {{ balance }}</span></p>
        {% if msg %}<p class="text-yellow-400 mb-4">{{ msg }}</p>{% endif %}
        <form method="POST">
            {% csrf_token %}
            <input type="number" name="bet" value="50" class="bg-black text-white p-2 rounded border border-cyan-500 mb-4">
            <button class="bg-cyan-600 px-6 py-2 rounded font-bold hover:bg-cyan-400 transition">Flip Coin</button>
        </form>
    </div>
</div>
{% endblock %}
