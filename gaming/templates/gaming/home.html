{% extends "gaming/base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto text-center">
    <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-8 neon-glow">
        Welcome to EliteDevelop Gaming
    </h1>
    <p class="text-slate-300 text-lg mb-12">Earn, trade, and challenge others with Electis (⚡).</p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="p-8 bg-slate-900 border-2 border-cyan-500 rounded-2xl hover:shadow-[0_0_20px_#22d3ee] transition duration-300">
            <i class="fa-solid fa-gamepad text-5xl text-cyan-400 mb-4"></i>
            <h2 class="text-2xl font-bold text-white mb-4">Arcade</h2>
            <p class="text-slate-400 mb-6">Test your luck in the coin flip and grow your balance.</p>
            <a href="{% url 'arcade' %}" class="inline-block bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-8 rounded-lg transition">
                Play Now
            </a>
        </div>

        <div class="p-8 bg-slate-900 border-2 border-purple-500 rounded-2xl hover:shadow-[0_0_20px_#a855f7] transition duration-300">
            <i class="fa-solid fa-paper-plane text-5xl text-purple-400 mb-4"></i>
            <h2 class="text-2xl font-bold text-white mb-4">Transfer</h2>
            <p class="text-slate-400 mb-6">Send Electis to your friends instantly.</p>
            <a href="{% url 'transfer' %}" class="inline-block bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-8 rounded-lg transition">
                Send Funds
            </a>
        </div>
    </div>
</div>
{% endblock %}
