{% extends 'base.html' %}

{% block title %}DM with {{ recipient.username }}{% endblock %}

{% block content %}
<div class="container py-3" style="max-width: 800px;">
    <div class="card bg-dark text-white border-secondary mb-3 shadow-sm">
        <div class="card-body d-flex justify-content-between align-items-center py-2 px-3">
            <div class="d-flex align-items-center gap-2">
                <a href="{% url 'dm_inbox' %}" class="text-white me-2"><i class="fa-solid fa-arrow-left"></i></a>
                <i class="fa-solid fa-circle-user fa-lg text-primary"></i>
                <h5 class="mb-0 fw-bold">{{ recipient.username }}</h5>
            </div>
        </div>
    </div>

    <div class="card bg-dark border-secondary shadow-sm mb-3 position-relative" style="height: 450px; overflow-y: auto;" id="message-container">

        <div id="loading-overlay" class="d-flex flex-column align-items-center justify-content-center h-100 my-auto text-white-50">
            <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="fw-semibold mb-0" style="letter-spacing: 0.5px;">Loading conversation...</p>
        </div>

        <div class="card-body p-3 d-flex flex-column gap-2 d-none" id="messages-list"></div>
    </div>

    <form id="dm-form" class="d-flex gap-2">
        {% csrf_token %}
        <input type="text" id="dm-input" name="content" class="form-control bg-dark text-white border-secondary" placeholder="Type a message..." required autocomplete="off" autofocus>
        <button type="submit" class="btn btn-primary px-4"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
</div>

<script>
    const conversationId = "{{ conversation.id }}";
    const container = document.getElementById('message-container');
    const messagesList = document.getElementById('messages-list');
    const loadingOverlay = document.getElementById('loading-overlay');
    const form = document.getElementById('dm-form');
    const input = document.getElementById('dm-input');
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    let isInitialLoad = true;
    let knownMessageCount = -1;

    function scrollToBottom() {
        if (container) {
            container.scrollTop = container.scrollHeight;
        }
    }

    // --- 1. POST Message via AJAX ---
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const content = input.value.trim();
        if (!content) return;

        const formData = new FormData();
        formData.append('content', content);

        fetch(window.location.href, {
            method: 'POST',
            headers: {
                'X-CSRFToken': csrfToken,
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'ok') {
                input.value = '';
                fetchMessages(); // Immediately trigger refresh
            }
        });
    });

    // --- 2. GET Poll for Messages ---
    function fetchMessages() {
        fetch(window.location.href, {
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(res => res.json())
        .then(data => {
            if (data.messages) {
                // If message count changes OR it's the initial load, update UI
                if (data.messages.length !== knownMessageCount || isInitialLoad) {
                    knownMessageCount = data.messages.length;
                    renderMessages(data.messages);
                }
            }
        })
        .finally(() => {
            if (isInitialLoad) {
                // Hide loader and show messages list
                if (loadingOverlay) loadingOverlay.classList.add('d-none');
                messagesList.classList.remove('d-none');
                isInitialLoad = false;
            }
        });
    }

    function renderMessages(messages) {
        if (messages.length === 0) {
            messagesList.innerHTML = `
                <div class="text-center text-muted my-auto" id="empty-notice">
                    <i class="fa-solid fa-comments fa-2x mb-2"></i>
                    <p class="mb-0">No messages yet. Say hello to {{ recipient.username }}!</p>
                </div>
            `;
            return;
        }

        messagesList.innerHTML = messages.map(msg => `
            <div class="d-flex ${msg.is_me ? 'justify-content-end' : 'justify-content-start'}">
                <div class="message-bubble p-2 rounded-3 text-white"
                     style="max-width: 75%; background-color: ${msg.is_me ? 'var(--bubble-color-custom, #0d6efd)' : '#334155'};">
                    <p class="mb-1 text-break">${escapeHtml(msg.content)}</p>
                    <small class="text-white-50 d-block text-end" style="font-size: 0.65rem;">
                        ${msg.timestamp}
                    </small>
                </div>
            </div>
        `).join('');

        scrollToBottom();
    }

    function escapeHtml(text) {
        return text.replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
        });
    }

    // Run immediate fetch on load, then poll every 2000ms
    fetchMessages();
    setInterval(fetchMessages, 2000);
</script>
{% endblock %}
