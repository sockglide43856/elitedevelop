{% extends 'base.html' %}

{% block title %}Public Chat Room{% endblock %}

{% block head %}
<style>
    .public-chat-wrapper { max-width: 800px; margin: 20px auto; background: #ffffff; border: 1px solid #e4e6eb; border-radius: 8px; display: flex; flex-direction: column; height: calc(100vh - 140px); overflow: hidden; padding: 0; width: 100%; transition: background 0.2s, border-color 0.2s; }
    .public-chat-header { padding: 15px 20px; border-bottom: 1px solid #e4e6eb; background: #f0f2f5; display: flex; align-items: center; gap: 10px; }
    #id_public_chat_container { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #fdfdfd; }

    .pub-msg-row { display: flex; flex-direction: column; max-width: 70%; }
    .pub-msg-row.incoming { align-self: flex-start; }
    .pub-msg-row.outgoing { align-self: flex-end; align-items: flex-end; }

    .pub-sender { font-size: 11px; font-weight: bold; color: #65676b; margin-bottom: 2px; margin-left: 4px; }
    .pub-bubble { padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }

    .incoming .pub-bubble { background-color: #e4e6eb; color: #1c1e21; border-top-left-radius: 4px; }

    /* CONNECTED TO SETTINGS CORE COLOR PICKER */
    .outgoing .pub-bubble { background-color: var(--bubble-color-custom, #0084ff); color: #ffffff; border-top-right-radius: 4px; }

    .public-chat-footer { padding: 15px 20px; border-top: 1px solid #e4e6eb; display: flex; gap: 10px; background: #ffffff; }
    #id_public_input { flex-grow: 1; padding: 12px 16px; border: 1px solid #e4e6eb; border-radius: 24px; outline: none; font-size: 14px; background: #f0f2f5; }
    #id_public_send_btn { padding: 0 22px; background: #24ac53; color: white; border: none; border-radius: 24px; font-weight: bold; cursor: pointer; }
    #id_public_send_btn:hover { background: #1e8e43; }

    /* --- PUBLIC CHAT DARK THEME MODULATORS --- */
    body.dark-theme .public-chat-wrapper { background: #1e293b; border-color: #334155; }
    body.dark-theme .public-chat-header { background: #0f172a; border-bottom-color: #334155; }
    body.dark-theme .public-chat-header h2 { color: #ffffff !important; }
    body.dark-theme #id_public_chat_container { background: #0f172a; }
    body.dark-theme .pub-sender { color: #94a3b8; }
    body.dark-theme .incoming .pub-bubble { background-color: #334155; color: #f8fafc; }
    body.dark-theme .public-chat-footer { background: #1e293b; border-top-color: #334155; }
    body.dark-theme #id_public_input { background: #334155; border-color: #475569; color: #ffffff; }
</style>
{% endblock %}

{% block content %}
<div class="public-chat-wrapper">
    <div class="public-chat-header">
        <h2><i class="fa-solid fa-earth-americas" style="color: #24ac53;"></i> Global Public Chat</h2>
    </div>

    <div id="id_public_chat_container"></div>

    <div class="public-chat-footer">
        <input type="text" id="id_public_input" placeholder="Broadcast a message to everyone..." autocomplete="off">
        <button type="button" id="id_public_send_btn"><i class="fa-solid fa-paper-plane"></i> Send</button>
    </div>
</div>
{% endblock %}

{% block script %}
<script>
    $(document).ready(function() {
        const currentUser = "{{ request.user.username }}";
        let localMessageCount = 0;

        function fetchPublicMessages() {
            $.getJSON('/chat/get_messages/', function(data) {
                if (!data.messages) return;

                if (data.messages.length !== localMessageCount) {
                    $('#id_public_chat_container').empty();

                    data.messages.forEach(function(msg) {
                        const isSelf = (msg.username === currentUser);
                        const rowClass = isSelf ? 'outgoing' : 'incoming';
                        const senderHeader = isSelf ? '' : `<span class="pub-sender">@${msg.username}</span>`;

                        $('#id_public_chat_container').append(`
                            <div class="pub-msg-row ${rowClass}">
                                ${senderHeader}
                                <div class="pub-bubble">${msg.message}</div>
                            </div>
                        `);
                    });

                    localMessageCount = data.messages.length;
                    $('#id_public_chat_container').scrollTop($('#id_public_chat_container')[0].scrollHeight);
                }
            });
        }

        function sendPublicMessage() {
            const text = $('#id_public_input').val().trim();
            if (!text) return;

            $.ajax({
                url: '/chat/send/',
                type: 'POST',
                contentType: 'application/json',
                headers: { 'X-CSRFToken': '{{ csrf_token }}' },
                data: JSON.stringify({ message: text }),
                success: function() {
                    $('#id_public_input').val('');
                    localMessageCount = 0;
                    fetchPublicMessages();
                }
            });
        }

        $('#id_public_send_btn').click(sendPublicMessage);
        $('#id_public_input').keypress(function(e) {
            if (e.which == 13) sendPublicMessage();
        });

        fetchPublicMessages();
        setInterval(fetchPublicMessages, 2000);
    });
</script>
{% endblock %}
