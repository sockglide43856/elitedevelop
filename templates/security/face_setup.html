{% extends "base.html" %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card bg-dark text-light shadow border-secondary mx-auto" style="max-width: 600px;">
        <div class="card-header border-secondary">
            <h3 class="m-0 text-primary"><i class="fa-solid fa-expand me-2"></i>Elite Biometric Setup</h3>
        </div>
        <div class="card-body p-4">
            <p class="text-muted">Opt-in to Face ID to secure your private chats and developer tools. This is processed entirely on your device—we never save your actual photo.</p>

            <div class="position-relative d-inline-block rounded overflow-hidden border border-info shadow mb-4">
                <video id="webcam" autoplay muted playsinline width="400" height="300" style="background: #000;"></video>
                <canvas id="overlay" class="position-absolute top-0 start-0" width="400" height="300"></canvas>
            </div>

            <div id="status-text" class="text-info font-monospace small mb-3">Booting neural network models...</div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                <button id="scan-btn" class="btn btn-primary fw-bold px-4" disabled>
                    <i class="fa-solid fa-camera me-2"></i> Scan & Opt-In
                </button>
                <a href="/dashboard/" class="btn btn-outline-secondary fw-bold px-4">
                    Skip for Now
                </a>
            </div>
        </div>
    </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script defer src="/static/js/face_scanner.js"></script>
{% endblock %}
