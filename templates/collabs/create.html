{% extends "base.html" %}

{% block title %}New Collab — EliteDevelop{% endblock %}

{% block head %}
<style>
.create-collab-page {
    max-width: 700px;
    margin: 0 auto;
    padding: 50px 20px;
}

.create-card {
    border: 1px solid rgba(127,127,127,.18);
    background: rgba(127,127,127,.06);
    border-radius: 22px;
    padding: 30px;
}

.create-title {
    margin: 0;
    font-size: 30px;
    font-weight: 800;
}

.create-subtitle {
    opacity: .6;
    margin: 8px 0 30px;
}

.form-group {
    margin-bottom: 20px;
}

.form-label {
    display: block;
    margin-bottom: 8px;
    font-weight: 700;
}

.form-input,
.form-textarea {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid rgba(127,127,127,.25);
    background: rgba(127,127,127,.08);
    color: inherit;
    border-radius: 12px;
    padding: 13px 14px;
    font: inherit;
    outline: none;
}

.form-input:focus,
.form-textarea:focus {
    border-color: #635bff;
}

.form-textarea {
    min-height: 130px;
    resize: vertical;
}

.form-actions {
    display: flex;
    gap: 12px;
    margin-top: 25px;
}

.btn-primary,
.btn-secondary {
    border: 0;
    border-radius: 12px;
    padding: 12px 18px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
}

.btn-primary {
    background: #635bff;
    color: white;
}

.btn-secondary {
    background: rgba(127,127,127,.12);
    color: inherit;
}
</style>
{% endblock %}

{% block content %}
<div class="create-collab-page">

    <div class="create-card">

        <h1 class="create-title">Create a Collab</h1>

        <p class="create-subtitle">
            Start a shared workspace for your project.
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label" for="name">
                    Name
                </label>

                <input
                    class="form-input"
                    id="name"
                    name="name"
                    type="text"
                    maxlength="100"
                    placeholder="e.g. My Team"
                    required
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="description">
                    Description
                </label>

                <textarea
                    class="form-textarea"
                    id="description"
                    name="description"
                    maxlength="500"
                    placeholder="What is this Collab for?"
                ></textarea>
            </div>

            <div class="form-actions">
                <a
                    href="{% url 'collabs:home' %}"
                    class="btn-secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    <i class="fa-solid fa-plus"></i>
                    Create Collab
                </button>
            </div>

        </form>

    </div>

</div>
{% endblock %}
